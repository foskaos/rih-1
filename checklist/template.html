<title>Rest Is History Listening Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single ledger column; year tabs, progress, then series rows that open into their episodes. */
:root {
  --bg: #eef0ec; --surface: #f8f9f6; --ink: #1c2220; --muted: #5f6763; --line: #d5d9d2;
  --accent: #8b2e2a; --accent-soft: #f1dedb; --done: #2f6b4f; --done-soft: #dcebe2; --bonus: #6a4f8a; --bonus-soft: #e7e0ef;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121615; --surface: #1a1f1d; --ink: #e5e8e3; --muted: #99a19c; --line: #2c3330;
  --accent: #e08a7f; --accent-soft: #3a2422; --done: #7cc39d; --done-soft: #1e3329; --bonus: #b9a2d8; --bonus-soft: #2c2537; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121615; --surface: #1a1f1d; --ink: #e5e8e3; --muted: #99a19c; --line: #2c3330;
  --accent: #e08a7f; --accent-soft: #3a2422; --done: #7cc39d; --done-soft: #1e3329; --bonus: #b9a2d8; --bonus-soft: #2c2537; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
header h1 { font: 400 clamp(26px, 5vw, 36px)/1.15 var(--display); margin: 0; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.status { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1.4em; }
.status.warn { color: var(--accent); }
.tabs { display: flex; gap: 4px; margin-top: 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { font: 500 15px var(--body); background: none; border: 0; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: flex; gap: 8px; align-items: baseline; }
.tab .pc { font: 12px var(--mono); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible, .chip:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 24px; margin: 20px 0 8px; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat .v { font: 500 22px var(--mono); font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 4px; }
.chip { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
h2 { font: 400 20px var(--display); margin: 28px 0 8px; display: flex; gap: 10px; align-items: baseline; }
h2 span { font: 13px var(--mono); color: var(--muted); }
.list { border-top: 1px solid var(--line); }
details { border-bottom: 1px solid var(--line); }
summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
.name { min-width: 0; }
.name b { font-weight: 600; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; color: var(--muted); align-items: center; }
.pill { font-size: 11px; font-weight: 500; letter-spacing: .03em; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.pill.bonus { background: var(--bonus-soft); color: var(--bonus); }
.pill.one { background: var(--line); color: var(--muted); }
.count { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.count::after { content: "▸"; transition: transform .15s; font-size: 11px; }
details[open] .count::after { transform: rotate(90deg); }
details.done .name b { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--done); }
details.done .count { color: var(--done); }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--done); margin: 0; cursor: pointer; }
ul.eps { list-style: none; margin: 0; padding: 0 4px 12px 36px; display: grid; gap: 2px; }
ul.eps label { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: start; padding: 4px 0; cursor: pointer; }
ul.eps input { width: 16px; height: 16px; margin-top: 2px; }
.date { font: 12px var(--mono); color: var(--muted); white-space: nowrap; padding-top: 2px; font-variant-numeric: tabular-nums; }
.et { min-width: 0; }
.et .tag { font-size: 11px; color: var(--bonus); font-weight: 600; margin-right: 6px; text-transform: uppercase; letter-spacing: .05em; }
.et.checked { color: var(--muted); }
.empty { color: var(--muted); padding: 16px 4px; }
@media (max-width: 480px) { ul.eps { padding-left: 8px; } ul.eps label { grid-template-columns: auto 1fr; } .date { grid-column: 2; padding: 0; } .et { grid-column: 2; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="wrap">
  <header>
    <h1>Rest Is History Listening Log</h1>
    <p>Every Club episode from 2024 to 2026, grouped into series with their members' bonuses. Tick a series to mark all of it, or open it to tick single episodes.</p>
    <div class="status" id="status" role="status">Loading your ticks…</div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section class="summary" id="summary"></section>
  <div class="filters" role="group" aria-label="Show">
    <button class="chip" id="f-all" data-f="all" aria-pressed="false">All</button>
    <button class="chip" id="f-todo" data-f="todo" aria-pressed="true">Still to listen</button>
    <button class="chip" id="f-done" data-f="done" aria-pressed="false">Listened</button>
  </div>
  <main id="main"></main>
</div>
<script type="application/json" id="catalog">__CATALOG__</script>
<script>
(() => {
  const CATALOG = JSON.parse(document.getElementById("catalog").textContent);
  const YEARS = [...new Set(CATALOG.map(g => g.year))].sort((a, b) => b - a);
  const byId = new Map(CATALOG.map(g => [g.id, g]));
  const ticks = new Map(); // group id -> Set of episode ids
  const open = new Set();
  let year = YEARS[0], filter = "todo", db = null, readOnly = false;
  const LS = "rih-ticks-v1";
  const $ = id => document.getElementById(id);
  const fmt = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
  const setStatus = (t, warn) => { const s = $("status"); s.textContent = t; s.className = "status" + (warn ? " warn" : ""); };

  const tickedIn = g => ticks.get(g.id) || new Set();
  const doneCount = g => g.eps.filter(e => tickedIn(g).has(e.id)).length;
  const isOneOff = g => g.kind === "standalone" || g.kind === "bonus";

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  }

  function renderTabs() {
    const tabs = $("tabs"); tabs.replaceChildren();
    for (const y of YEARS) {
      const gs = CATALOG.filter(g => g.year === y);
      const total = gs.reduce((a, g) => a + g.eps.length, 0), done = gs.reduce((a, g) => a + doneCount(g), 0);
      tabs.append(el("button", { class: "tab", role: "tab", id: "tab-" + y, "aria-selected": String(y === year),
        onclick: () => { year = y; render(); } }, String(y), el("span", { class: "pc", text: Math.round(100 * done / total) + "%" })));
    }
  }

  function renderSummary(gs) {
    const series = gs.filter(g => !isOneOff(g));
    const eps = gs.reduce((a, g) => a + g.eps.length, 0), epsDone = gs.reduce((a, g) => a + doneCount(g), 0);
    const sDone = series.filter(g => doneCount(g) === g.eps.length).length;
    const oneOffs = gs.filter(isOneOff), oDone = oneOffs.filter(g => doneCount(g) === g.eps.length).length;
    const stat = (k, a, b) => el("div", { class: "stat" }, el("div", { class: "k", text: k }),
      el("div", { class: "v" }, String(a), el("small", { text: " / " + b })),
      el("div", { class: "bar" }, Object.assign(el("i"), { style: `width:${b ? 100 * a / b : 0}%` })));
    $("summary").replaceChildren(stat("Episodes listened", epsDone, eps), stat("Series finished", sDone, series.length), stat("One-offs listened", oDone, oneOffs.length));
  }

  function groupRow(g) {
    const n = doneCount(g), total = g.eps.length, all = n === total;
    const cb = el("input", { type: "checkbox", id: "g-" + g.id, "aria-label": "Listened to all of " + g.name });
    cb.checked = all; cb.indeterminate = n > 0 && !all; cb.disabled = readOnly;
    cb.addEventListener("click", e => { e.stopPropagation(); setGroup(g, cb.checked ? g.eps.map(x => x.id) : []); });
    const main = g.eps.filter(e => e.r === "main").length, bonus = total - main;
    const kindPill = g.kind === "bonus-series" ? el("span", { class: "pill bonus", text: "Members' mini-series" })
      : g.kind === "bonus" ? el("span", { class: "pill bonus", text: "Members' bonus" })
      : g.kind === "standalone" ? el("span", { class: "pill one", text: "Standalone" })
      : el("span", { class: "pill", text: main > 1 ? `${main}-part series` : "Episode + extras" });
    const bits = [kindPill, el("span", { text: "from " + fmt(g.date) })];
    if (bonus && g.kind === "series") bits.push(el("span", { text: `+ ${bonus} bonus` }));
    const d = el("details", { class: all ? "done" : "" },
      el("summary", {}, cb, el("div", { class: "name" }, el("b", { text: g.name }), el("div", { class: "meta" }, ...bits)),
        el("span", { class: "count", text: `${n}/${total}` })),
      el("ul", { class: "eps" }, ...g.eps.map(e => {
        const ecb = el("input", { type: "checkbox", id: "e-" + e.id }); ecb.checked = tickedIn(g).has(e.id); ecb.disabled = readOnly;
        ecb.addEventListener("change", () => { const s = new Set(tickedIn(g)); ecb.checked ? s.add(e.id) : s.delete(e.id); setGroup(g, [...s]); });
        return el("li", {}, el("label", {}, ecb, el("span", { class: "date", text: fmt(e.d) }),
          el("span", { class: "et" + (ecb.checked ? " checked" : "") }, e.r === "bonus" ? el("span", { class: "tag", text: "Bonus" }) : null,
            (e.n ? "#" + e.n + " " : "") + e.t)));
      })));
    d.open = open.has(g.id);
    d.addEventListener("toggle", () => d.open ? open.add(g.id) : open.delete(g.id));
    return d;
  }

  function render() {
    renderTabs();
    const gs = CATALOG.filter(g => g.year === year);
    renderSummary(gs);
    for (const b of document.querySelectorAll(".chip")) b.setAttribute("aria-pressed", String(b.dataset.f === filter));
    const keep = g => filter === "all" || (filter === "done") === (doneCount(g) === g.eps.length);
    const main = $("main"); main.replaceChildren();
    for (const [title, part] of [["Series", gs.filter(g => !isOneOff(g))], ["One-offs", gs.filter(isOneOff)]]) {
      const shown = part.filter(keep);
      main.append(el("h2", {}, title, el("span", { text: `${shown.length} shown of ${part.length}` })));
      main.append(shown.length ? el("div", { class: "list" }, ...shown.map(groupRow))
        : el("p", { class: "empty", text: filter === "todo" ? "All listened. Nice." : "Nothing here yet." }));
    }
  }

  for (const b of document.querySelectorAll(".chip")) b.addEventListener("click", () => { filter = b.dataset.f; render(); });

  // ---- persistence: db when available (Claude can read it), else this browser only
  const writing = new Map(), queued = new Map();
  async function save(gid) {
    if (writing.get(gid)) { queued.set(gid, true); return; }
    writing.set(gid, true);
    try {
      do {
        queued.delete(gid);
        const g = byId.get(gid), eps = {};
        for (const id of tickedIn(g)) eps[id] = true;
        await db.collection("listened").doc(gid).set({ name: g.name, year: g.year, eps, done: Object.keys(eps).length === g.eps.length });
      } while (queued.get(gid));
      setStatus("Saved");
    } catch (e) {
      if (e && e.code === "invalid_argument") { readOnly = true; setStatus("You can view this list but not change it.", true); render(); }
      else setStatus("Couldn't save that tick. Try again in a moment.", true);
    } finally { writing.set(gid, false); }
  }
  function setGroup(g, ids) {
    ticks.set(g.id, new Set(ids));
    render();
    if (db) save(g.id);
    else { try { localStorage.setItem(LS, JSON.stringify(Object.fromEntries([...ticks].map(([k, v]) => [k, [...v]])))); } catch {} setStatus("Saved in this browser only"); }
  }

  render();
  (async () => {
    db = window.claude?.use ? await window.claude.use("db") : null;
    if (!db) {
      try { for (const [k, v] of Object.entries(JSON.parse(localStorage.getItem(LS) || "{}"))) if (byId.has(k)) ticks.set(k, new Set(v)); } catch {}
      setStatus("Ticks are saved in this browser only."); render(); return;
    }
    db.collection("listened").onSnapshot(snap => {
      ticks.clear();
      for (const d of snap.docs) if (byId.has(d.id)) ticks.set(d.id, new Set(Object.keys(d.data().eps || {})));
      if (!snap.metadata.hasPendingWrites) setStatus("Synced");
      render();
    }, () => setStatus("Lost the connection to your saved ticks. Reload the page to reconnect.", true));
  })();
})();
</script>
